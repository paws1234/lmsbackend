# Laravel API + PostgreSQL, self-contained.
#
#   docker compose up -d --build
#   docker compose exec backend php artisan migrate     # first run only
#   curl http://localhost:8000/api/lms
#
# The database this talks to is whatever the LMS_DB_* values below resolve to: a
# throwaway Postgres container by default, or a hosted Supabase project when you
# set them in .env — see the Supabase section of DOCKER.md.
#
# The Vue frontend lives in its own repository (lmsfrontend) and runs as a
# separate compose project: the *browser* is what calls this API, so the two
# stacks never need to share a Docker network.
name: lmsbackend

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LMS_DB_DATABASE:-lms}
      POSTGRES_USER: ${LMS_DB_USERNAME:-lms}
      POSTGRES_PASSWORD: ${LMS_DB_PASSWORD:-lms}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Published on 5433 by default so it cannot collide with a Postgres that
      # is already running on the host (a local install usually owns 5432).
      # The API always reaches it as db:5432.
      - "${LMS_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LMS_DB_USERNAME:-lms} -d ${LMS_DB_DATABASE:-lms}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
    image: lms-backend:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: CTU LMS
      APP_ENV: local
      APP_DEBUG: "true"
      # Must match the key the frontend decrypts responses with, i.e. the
      # APP_KEY the API was provisioned with.  Override with LMS_APP_KEY.
      APP_KEY: ${LMS_APP_KEY:-base64:/bdLq63o8GHzO/KFiXXVmRgShpXRSS2okcRmfwNbbwM=}
      APP_URL: http://localhost:${LMS_BACKEND_PORT:-8000}
      LOG_CHANNEL: stack
      DB_CONNECTION: pgsql
      # Defaults to the `db` container.  Set LMS_DB_HOST to a Supabase pooler
      # hostname (and LMS_DB_SSLMODE=require) to run against the cloud instead.
      DB_HOST: ${LMS_DB_HOST:-db}
      DB_PORT: "${LMS_DB_PORT:-5432}"
      DB_DATABASE: ${LMS_DB_DATABASE:-lms}
      DB_USERNAME: ${LMS_DB_USERNAME:-lms}
      DB_PASSWORD: ${LMS_DB_PASSWORD:-lms}
      DB_SSLMODE: ${LMS_DB_SSLMODE:-prefer}
      # A single connection URI, if you would rather use one than the DB_*
      # values above.  Deliberately NOT prefixed with LMS_ like the rest: the
      # same value is wanted both by the container and by `php artisan` on the
      # host.  It takes precedence over every DB_* value when non-empty, and an
      # empty value means "not set".
      DATABASE_URL: ${DATABASE_URL:-}
      # Supabase's transaction pooler (port 6543) cannot hold prepared
      # statements across transactions; set this to true when using it.
      DB_EMULATE_PREPARES: "${LMS_DB_EMULATE_PREPARES:-false}"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
    volumes:
      # Live source code...
      - .:/var/www/html
      # ...but keep the dependencies installed in the image, not the host's.
      - backend_vendor:/var/www/html/vendor
    ports:
      - "${LMS_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/lms"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  # Named for Postgres, not `db_data`, so a leftover MariaDB data directory
  # cannot end up mounted where initdb expects an empty one.
  pg_data:
  backend_vendor:
